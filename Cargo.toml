[workspace]
resolver = "2"

members = [
    "crates/runtime",
    "crates/events",
    "crates/scheduler",
    "crates/execution_engine",
    "crates/inference",
    "crates/model_registry",
    "crates/capability_registry",
    "crates/model_router",
    "crates/model_lifecycle",
    "crates/provider_manager",
    "crates/benchmark",
    "crates/benchmark_engine",
    "crates/memory",
    "crates/context",
    "crates/resource_manager",
    "crates/coordinator",
    "crates/ai_core",
    "crates/audio",
    "crates/vision",
    "crates/agent_planner",
    "crates/motion",
    "crates/security",
    "crates/networking",
    "crates/power",
    "crates/devices",
    "crates/storage",
    "crates/hal",
    "crates/kernel",
    "crates/tool_capability",
    "crates/tool_executor",
    "crates/byngox-cli",
    "crates/prompt_builder",
    "crates/task_runtime",
    "crates/reasoning_engine", 
    "crates/tool_capability", "crates/execution_engine",
]

[workspace.dependencies]
serde = "1.0"
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
